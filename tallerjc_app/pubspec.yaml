name: gyfsoftware_movil
description: App movil de pedidos para vendedores - GyfSoftware
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP y conectividad
  http: ^1.2.0
  connectivity_plus: ^6.0.0
  
  # Estado y almacenamiento local
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  
  # Utilidades
  url_launcher: ^6.2.0
  intl: ^0.19.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  # Generación de PDF (nota de pedido)
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_gyf_1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_gyf_foreground.png"